[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroproc"
version = "0.1.0"
description = "Reproducible scripted chain for colour astronomical images for Wikimedia (plan.md §7, §16)"
requires-python = ">=3.11"
dependencies = [
	"numpy>=1.26",
	"astropy>=6",
	"scipy>=1.11",
	"pillow>=10",
	"tifffile>=2024.0",
	"requests>=2.31",
	"astroquery>=0.4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
astroproc = "astroproc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "src"]
